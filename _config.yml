- scope:
    path: ''
    type: references
  values:
    main-description:
    title:
    image:
    image-alt:
    sitemap: false
email: contact@digitalpebble.com
description: DigitalPebble Ltd is a consultancy specialised in green software, GreenOps and FinOps.
url: https://digitalpebble.com
baseurl:
lang: en_GB
logo: "/images/logo.png"
social:
  name: DigitalPebble Ltd
  links:
  - https://www.linkedin.com/company/digitalpebble-ltd/
  - https://github.com/digitalpebble
sass:
  sass_dir: _sass
  style: compressed
markdown: kramdown
permalink: "/blog/:title"
theme: minima
exclude:
- Gemfile.lock
- node_modules
plugins:
- jekyll-feed
- jekyll-seo-tag
