<!-- Your Basic Site Informations -->
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta http-equiv="X-UA-Compatible" content="IE=11" />
<!-- title, description, canonical, Open Graph and JSON-LD are generated by jekyll-seo-tag -->
{% seo %}
<!-- Explicit Organization schema: jekyll-seo-tag's own JSON-LD attributes BlogPosting
     "publisher" to the post author rather than the company, so we provide the
     canonical Organization entity ourselves for Google to associate with the site. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "DigitalPebble Ltd",
  "url": "{{ site.url }}/",
  "logo": "{{ site.url }}{{ site.logo }}",
  "email": "{{ site.email }}",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "16 Codrington Road",
    "addressLocality": "Bristol",
    "postalCode": "BS7 8ET",
    "addressCountry": "GB"
  },
  "sameAs": [
    {% for link in site.social.links %}"{{ link }}"{% unless forloop.last %},{% endunless %}{% endfor %}
  ]
}
</script>
<!-- Mobile Specific Meta -->
<meta http-equiv="X-UA-Compatible" content="IE=11" />
<meta name="keywords" content="{% if page.meta-keywords %}{{ page.meta-keywords }}{% else %}{{ site.keywords }}{% endif %}">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<base href="/" />
<!-- Standard Favicon -->
<link rel="icon" type="image/x-icon" href="{{site.baseurl}}/images/favicon.ico" />
<!-- Stylesheets -->
<link rel="stylesheet" type="text/css" href="{{site.baseurl}}/slick/slick.css" />
<link rel="stylesheet" type="text/css" href="{{site.baseurl}}/slick/slick-theme.css" />
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<link rel="stylesheet" href="{{ "/css/main.css" | prepend: site.baseurl }}" />

<!-- For not indexing -->
<!-- <meta name="robots" content="noindex,nofollow"> -->
<meta name="google-site-verification" content="ZNIbylXN61hwJhB39tK17-u7RsU5kgiHXWbQ5F7lrNc" />



{% include header-scripts.html %}

<script defer src="{{site.baseurl}}/js/jquery-3.js"></script>
